 <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RankPilot IA</title>
</head>
<body>
  <h1>Scan SEO</h1>
  
  <input id="url" placeholder="https://monsite.com" style="width:300px" />
  <button onclick="scan()">Scanner</button>
  
  <h3>Résultat :</h3>
  <pre id="result"></pre>

  <script>
    async function scan() {
      const url = document.getElementById('url').value;
      document.getElementById('result').innerText = 'Scan en cours...';
      
      const res = await fetch('/api/scan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ url })
      });
      
      const data = await res.json();
      document.getElementById('result').innerText = data.report || data.error;
    } // <-- Il te manquait cette accolade
  </script> <!-- <-- Et cette balise -->
</body>
</html>
